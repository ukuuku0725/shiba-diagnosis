<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生粋の柴度診断</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<body>

    <div id="start">
        <h1><img src="./images/main_title.png" alt="生粋の柴度診断"></h1>
        <p>あなたの愛犬は、どれくらい生粋の柴？</p>
        <button id="startButton">診断スタート</button>
    </div>

    <!-- 診断画面 -->
    <div id="quiz" style="display: none;">
        <p id="questionNumber"></p>
        <h2 id="questionText"></h2>
        <div id="choices"></div>
    </div>

    <!-- 結果画面 -->
    <div id="result" style="display: none;">

        <h2>診断結果</h2>

        <h3><img id="resultTitle" src="" alt="診断結果"></h3>

        <p id="shibaPercentage"></p>

        <img id="medalImage" src="" alt="柴度メダル">

        <p id="resultComment"></p>

        <div id="categoryResults"></div>

    </div>

    <script src="app.js"></script>
</body>
</html>
